name: LautFunk Playlist Player - Windows & macOS VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['playlist-v*']
    paths:
      - 'LautFunk_Playlist_Player/**'
      - '.github/workflows/lautfunk-playlist-player.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: LautFunk_Playlist_Player

jobs:
  windows:
    name: Windows x64 VST3
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Erlaube lange Git-Pfade
        run: git config --global core.longpaths true
      - name: CMake konfigurieren (Visual Studio 2022)
        run: |
          cmake -S "$env:PROJECT_DIR" -B "$env:PROJECT_DIR/build-ci-win" `
            -G "Visual Studio 17 2022" -A x64 `
            "-DFETCHCONTENT_BASE_DIR=$env:RUNNER_TEMP/lfdeps"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows-VST3 bauen
        run: |
          cmake --build "$env:PROJECT_DIR/build-ci-win" --config Release --target LautFunkPlaylistPlayer_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows-VST3 als ZIP packen
        run: |
          $bundle = Join-Path "$env:PROJECT_DIR/build-ci-win/LautFunkPlaylistPlayer_artefacts/Release/VST3" 'LautFunk Playlist Player.vst3'
          if (-not (Test-Path -LiteralPath $bundle)) { throw "VST3-Ordner fehlt: $bundle" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -LiteralPath $bundle -DestinationPath 'dist/LautFunk-Playlist-Player-v1.0-Windows-x64.zip' -Force
          if (-not (Test-Path 'dist/LautFunk-Playlist-Player-v1.0-Windows-x64.zip')) { throw 'ZIP wurde nicht erstellt' }
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-player-windows-x64
          path: dist/LautFunk-Playlist-Player-v1.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Universal VST3 (Intel + Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: CMake konfigurieren (Xcode, Universal)
        shell: bash
        run: |
          cmake -S "$PROJECT_DIR" -B "$PROJECT_DIR/build-ci-mac" -G Xcode \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "-DFETCHCONTENT_BASE_DIR=$RUNNER_TEMP/lfdeps"
      - name: macOS-VST3 bauen
        shell: bash
        run: |
          cmake --build "$PROJECT_DIR/build-ci-mac" --config Release \
            --target LautFunkPlaylistPlayer_VST3 --parallel 2
      - name: Beide Architekturen validieren und ZIP packen
        shell: bash
        run: |
          bundle="$PROJECT_DIR/build-ci-mac/LautFunkPlaylistPlayer_artefacts/Release/VST3/LautFunk Playlist Player.vst3"
          test -d "$bundle"
          binary="$bundle/Contents/MacOS/LautFunk Playlist Player"
          test -f "$binary"
          lipo -info "$binary"
          lipo -archs "$binary" | grep -qw arm64
          lipo -archs "$binary" | grep -qw x86_64
          # Ad-hoc-Signatur: noch KEINE Apple-Developer-Signatur oder Notarisierung.
          codesign --force --deep --sign - --timestamp=none "$bundle"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$bundle" \
            'dist/LautFunk-Playlist-Player-v1.0-macOS-Universal.zip'
          test -s 'dist/LautFunk-Playlist-Player-v1.0-macOS-Universal.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-player-macos-universal
          path: dist/LautFunk-Playlist-Player-v1.0-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Release mit beiden Downloads erstellen
    if: startsWith(github.ref, 'refs/tags/playlist-v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: playlist-player-*
          path: release-files
          merge-multiple: true
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lah release-files/
          gh release create "$GITHUB_REF_NAME" release-files/*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LautFunk Playlist Player v1.0" \
            --notes "VST3 für REAPER: Windows x64 und macOS Universal (Intel + Apple Silicon). Die macOS-Ausgabe ist ad-hoc signiert, aber nicht durch Apple notarisiert. Bitte auf echten Macs testen."
