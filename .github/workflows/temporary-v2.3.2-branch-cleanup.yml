name: Finalize temporary v2.3.2 branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-v2.3.2-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify stable release and remove housekeeping refs and temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=playlist-soundboard-v2.3.2
          tag_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          [[ "$tag_sha" == "a9d706aac77f2887a559a6afccf8528e85f32a6c" ]]
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -Fxq true
          main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]]

          # Preflight: validate both previously created maintenance branches.
          for branch in "maintenance/delete-v2.3.2-temporary-branches" "maintenance/fix-v2.3.2-branch-cleanup-check"; do
            case "$branch" in
              "maintenance/delete-v2.3.2-temporary-branches") expected="ec3eae89b498fb696a5eb46633f591894fa04cc5" ;;
              "maintenance/fix-v2.3.2-branch-cleanup-check") expected="890841c823f66c1fd22141a2a9430c236841ddde" ;;
              *) exit 1 ;;
            esac
            actual="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$actual" == "$expected" ]] || { echo "::error::Maintenance ref changed: $branch"; exit 1; }
          done

          # The finalizer branch must be from the merged PR for this exact workflow change.
          last_pr="$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.head.ref == "maintenance/finalize-v2.3.2-cleanup" and .merged_at != null)] | first | .head.sha')"
          [[ -n "$last_pr" && "$last_pr" != "null" ]] || { echo "::error::Finalizer PR not found"; exit 1; }
          current_finalizer="$(gh api "repos/$repo/git/ref/heads/maintenance/finalize-v2.3.2-cleanup" --jq '.object.sha')"
          [[ "$last_pr" == "$current_finalizer" ]] || { echo "::error::Finalizer branch changed"; exit 1; }

          for branch in "maintenance/delete-v2.3.2-temporary-branches" "maintenance/fix-v2.3.2-branch-cleanup-check" "maintenance/finalize-v2.3.2-cleanup"; do
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
            echo "Deleted housekeeping branch: $branch"
          done

          # Commit the removal of this ONE-TIME workflow directly to main using
          # the normal (non-force) GitHub Contents API. No release/tag is touched.
          wf=".github/workflows/temporary-v2.3.2-branch-cleanup.yml"
          file_sha="$(gh api "repos/$repo/contents/$wf" --jq '.sha')"
          gh api -X DELETE "repos/$repo/contents/$wf" \
            -f message="Remove completed one-time v2.3.2 maintenance workflow" \
            -f sha="$file_sha" -f branch=main --jq '.commit.sha'
          echo "Removed finished one-time workflow. Release $tag is intact."
